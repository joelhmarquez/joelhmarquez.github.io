# joelhmarquez.com — site configuration
title: Joel Marquez
name: Joel Marquez
description: >-
  Essays and notes by Joel Marquez, Principal Engineering Manager at
  Microsoft — on engineering leadership, agentic AI, and technology.
  Home of his employment-based sponsorship handbook for DACA recipients.
bio: Principal Engineering Manager @ Microsoft

url: https://joelhmarquez.com
baseurl: ""
repository: joelhmarquez/joelhmarquez.github.io

# Profile picture (a new photo can be dropped in at the same path)
picture: assets/images/profile.jpeg
external-image: false

# Social profiles (values are appended to the service URL)
instagram: joelhmarquez/
linkedin: joelhmarquez/

authors:
  joelhmarquez:
    name: Joel Marquez
    bio: Principal Engineering Manager @ Microsoft
    external-image: false
    picture: assets/images/profile.jpeg

# Posts keep their long-standing URLs: /:title/
permalink: /:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-redirect-from

# Analytics: the old Universal Analytics property was removed entirely —
# Google shut down Universal Analytics in 2023, so it collected nothing.
# To add privacy-friendly stats later, sign up for Cloudflare Web
# Analytics, paste its token below, and uncomment the snippet in
# _includes/head.html.
# cloudflare_analytics_token: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  # Retired Jekflix-era leftovers: still in the repo (the connector used for
  # this rebuild cannot delete files) but kept out of the built site.
  - FAQ.md
  - Rakefile
  - script
  - _config-dev.yml
