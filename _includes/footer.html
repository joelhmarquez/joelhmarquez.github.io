<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-meta">
      {{ site.name }} © {{ site.time | date: "%Y" }} · {{ site.bio }}
    </p>
    <p class="footer-links">
      {% if site.linkedin %}<a href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
      {% if site.instagram %}<a href="https://instagram.com/{{ site.instagram }}" target="_blank" rel="noopener">Instagram</a>{% endif %}
      <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
