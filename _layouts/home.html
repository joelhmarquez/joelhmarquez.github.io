---
layout: default
---
<section class="hero">
  <img class="hero-photo" src="{{ site.picture | relative_url }}" alt="{{ site.name }}">
  <h1 class="hero-name">{{ site.name }}</h1>
  <p class="hero-bio">{{ site.bio }}</p>
  <p class="hero-links">
    {% if site.linkedin %}<a href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
    {% if site.instagram %}<a href="https://instagram.com/{{ site.instagram }}" target="_blank" rel="noopener">Instagram</a>{% endif %}
    <a href="{{ "/about" | relative_url }}">About me</a>
  </p>
</section>


<section class="home-section">
  <h2 class="section-title">All writing</h2>
  {% include writing-list.html %}
</section>
